<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Sorgulama Paneli</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --primary-dark: #1d4ed8;
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger-bg: #fee2e2; 
            --danger-text: #991b1b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 30px 15px; 
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card { 
            background: var(--card-bg); 
            padding: 2.5rem; 
            border-radius: 1.5rem; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05); 
            text-align: center; 
            border: 1px solid var(--border-color); 
            margin-bottom: 20px;
        }

        h2 { color: var(--primary); margin-top: 0; margin-bottom: 5px; font-size: 1.75rem; font-weight: 700; }
        
        .update-info { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; font-weight: 600; }
        .update-info span { color: var(--text-main); background-color: #f1f5f9; padding: 3px 10px; border-radius: 6px; }

        .status-badge {
            font-size: 0.8rem;
            margin-bottom: 20px;
            color: var(--text-muted);
            display: inline-block;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 12px;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 2px solid var(--border-color); 
            border-radius: 12px; 
            font-size: 16px; 
            text-align: center; 
            outline: none; 
            transition: all 0.2s ease; 
            background-color: #fff;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        
        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px; 
            transition: background 0.2s, opacity 0.2s; 
            margin-top: 5px; 
        }
        button:hover:not(:disabled) { background: var(--primary-dark); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #sonuc { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 14px; 
            display: none; 
            border: 1px solid var(--border-color); 
            text-align: left; 
            background-color: #fff;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .name-label { 
            font-size: 1.2rem; 
            font-weight: 700; 
            display: block; 
            margin-bottom: 15px; 
            color: var(--text-main); 
            text-transform: uppercase; 
            text-align: center; 
            border-bottom: 2px solid #f1f5f9; 
            padding-bottom: 12px; 
        }
        
        .info-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 0; 
            border-bottom: 1px dashed var(--border-color); 
            font-size: 0.95rem; 
            color: var(--text-muted); 
        }
        .info-row:last-child { border-bottom: none; }
        .info-row span { font-weight: 600; }
        .info-row b { color: var(--text-main); text-align: right; max-width: 60%; word-break: break-word; font-weight: 600; }
        
        .alert-box {
            text-align: center;
            color: var(--danger-text);
            font-weight: 600;
            padding: 10px;
        }

        .alert-text { color: var(--danger-text); font-weight: 700; }

        /* Grid / Liste görünümü için ek stil */
        .grid-view-toggle {
            margin-top: 15px;
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            padding: 10px;
        }
        .grid-view-toggle:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Öğrenci Sorgulama</h2>
        <div id="guncellemeTarihi" class="update-info">Son Güncelleme: <span id="tarihMetni">Yükleniyor...</span></div>
        <div id="status" class="status-badge">Veriler Hazırlanıyor...</div>
        
        <form onsubmit="sorgula(); return false;">
            <div class="input-group">
                <input type="text" id="tcInput" inputmode="numeric" placeholder="T.C. Kimlik No (11 Hane)" maxlength="11">
            </div>
            <div class="input-group">
                <input type="text" id="ogrNoInput" inputmode="numeric" placeholder="Öğrenci No">
            </div>
            <button type="submit" id="sorgulaBtn" disabled>SORGULA</button>
        </form>
        
        <div id="sonuc"></div>
    </div>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSkDz2S-vnw6gr6amVAIX7OYj2c8l5WDrDxkWI-8WiKZW1qaaJJJeP0oxcMgYIiozY-ONZV23V0Xw5m/pub?output=csv';
    let ogrenciListesi = [];

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function csvToArray(text) {
        let cleanText = text.replace(/\r/g, "");
        let p = '', Array = [[]], Symbol = ',', i = 0, l = 0, q = false;
        for (let character of cleanText) {
            if (character === '"') { q = !q; }
            else if (character === Symbol && !q) { p = ''; Array[i][++l] = p; }
            else if (character === '\n' && !q) { if (Array[i][l] === undefined) { Array[i][l] = p; } p = ''; Array[++i] = [p]; l = 0; }
            else { p += character; Array[i][l] = p; }
        }
        return Array;
    }

    async function verileriGetir() {
        try {
            const res = await fetch(csvUrl);
            const data = await res.text();
            const satirlar = csvToArray(data);
            
            if (satirlar.length > 1 && satirlar[1].length > 10) {
                const tarihDegeri = satirlar[1][10]?.trim();
                document.getElementById('tarihMetni').innerText = tarihDegeri || "Belirtilmedi";
            } else {
                document.getElementById('tarihMetni').innerText = "-";
            }

            satirlar.forEach((sutun, index) => {
                if (index === 0) return;
                
                if (sutun && sutun.length >= 1) {
                    const tc = sutun[0]?.trim() || "";         
                    const ogrNo = sutun[1]?.trim() || "";       
                    const ad = sutun[2]?.trim() || "";          
                    const sube = sutun[3]?.trim() || "-";       
                    const devamsizlik = sutun[4]?.trim() || "-";
                    const dal = sutun[5]?.trim() || "-";          
                    const ogretmen = sutun[6]?.trim() || "-";   
                    const isletme = sutun[7]?.trim() || "";     
                    const iseGiris = sutun[8]?.trim() || "-";   
                    const istenCikis = (sutun.length > 9 && sutun[9]) ? sutun[9].trim() : "-"; 
                    
                    const tcAnahtar = tc.length >= 4 ? (tc.slice(0, 2) + tc.slice(-2)) : tc;
                    
                    if(tc && ogrNo) {
                        ogrenciListesi.push({ 
                            tc, tcAnahtar, ogrNo, ad, sube, devamsizlik, dal, ogretmen, isletme, iseGiris, istenCikis
                        });
                    }
                }
            });
            document.getElementById('status').innerText = "● Sistem Hazır";
            document.getElementById('sorgulaBtn').disabled = false;
        } catch (e) {
            document.getElementById('status').innerText = "Bağlantı Hatası!";
            document.getElementById('tarihMetni').innerText = "Hata";
        }
    }

    function sorgula() {
        const girilenTc = document.getElementById('tcInput').value.trim();
        const ogrNoInput = document.getElementById('ogrNoInput').value.trim();
        const sonucDiv = document.getElementById('sonuc');
        
        if (girilenTc === "" || ogrNoInput === "") {
            sonucDiv.style.display = "block";
            sonucDiv.style.backgroundColor = "var(--danger-bg)";
            sonucDiv.innerHTML = "<div class='alert-box'>⚠️ LÜTFEN HEM T.C. KİMLİK NO HEM DE ÖĞRENCİ NO GİRİNİZ!</div>";
            return;
        }

        if (girilenTc.length !== 11) {
            sonucDiv.style.display = "block";
