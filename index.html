<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Sorgulama Paneli</title>
    <style>
        :root { --primary: #2563eb; --secondary: #475569; --bg: #f8fafc; --success: #ffffff; --danger: #fee2e2; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; box-sizing: border-box; }
        .card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; border: 1px solid #e2e8f0; }
        h2 { color: var(--primary); margin-bottom: 5px; font-size: 1.5rem; }
        
        .update-info { font-size: 0.85rem; color: #64748b; margin-bottom: 15px; font-weight: 600; }
        .update-info span { color: #0f172a; background-color: #f1f5f9; padding: 2px 8px; border-radius: 6px; }

        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; font-size: 16px; text-align: center; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); }
        
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: opacity 0.3s, background-color 0.2s; margin-top: 5px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { opacity: 0.92; }

        .btn-outline { background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; margin-top: 12px; font-size: 14px; padding: 12px; }
        .btn-outline:hover:not(:disabled) { background: #e2e8f0; opacity: 1; }
        
        .btn-back { background: #64748b; margin-top: 12px; font-size: 14px; padding: 12px; }
        .btn-use { background: #059669; margin-top: 12px; font-size: 15px; }

        .sonuc-box { margin-top: 25px; padding: 20px; border-radius: 15px; display: none; border: 1px solid #cbd5e1; text-align: left; background-color: #fff; }
        .name-label { font-size: 1.25rem; font-weight: bold; display: block; margin-bottom: 15px; color: #1e293b; text-transform: uppercase; text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 0.95rem; color: #475569; }
        .info-row:last-child { border-bottom: none; }
        .info-row span { font-weight: 600; color: #64748b; }
        .info-row b { color: #0f172a; text-align: right; max-width: 60%; word-break: break-word; }
        
        .alert-text { color: #dc2626; font-weight: 900; }
        .hidden { display: none; }
        
        .ogr-no-badge { font-size: 2rem; font-weight: 900; color: var(--primary); background: #eff6ff; padding: 12px; border-radius: 12px; margin: 10px 0; text-align: center; letter-spacing: 1px; border: 1px dashed #93c5fd; }
    </style>
</head>
<body>

<div class="card">
    <!-- EKRAN 1: ANA ÖĞRENCİ SORGULAMA -->
    <div id="anaEkran">
        <h2>Öğrenci Sorgulama</h2>
        <div id="guncellemeTarihi" class="update-info">Son Güncelleme: <span id="tarihMetni">Yükleniyor...</span></div>
        <div id="status" style="font-size:12px; margin-bottom:15px; color:#64748b;">Veriler Hazırlanıyor...</div>
        
        <form onsubmit="sorgula(); return false;">
            <input type="text" id="tcInput" inputmode="numeric" placeholder="T.C. Kimlik No (11 Hane)" maxlength="11">
            <input type="text" id="ogrNoInput" inputmode="numeric" placeholder="Öğrenci No">
            <button type="submit" id="sorgulaBtn" disabled>SORGULA</button>
        </form>

        <button type="button" class="btn-outline" onclick="ekranDegistir('noBulEkran')">🔍 Öğrenci No Öğren</button>
        
        <div id="sonuc" class="sonuc-box"></div>
    </div>

    <!-- EKRAN 2: ÖĞRENCİ NO ÖĞRENME -->
    <div id="noBulEkran" class="hidden">
        <h2>Öğrenci No Öğren</h2>
        <div class="update-info">T.C. Kimlik Numaranız ile Okul Numaranızı Bulun</div>
        <div id="noStatus" style="font-size:12px; margin-bottom:15px; color:#64748b;">Liste Kontrol Ediliyor...</div>

        <form onsubmit="okulNoBul(); return false;">
            <input type="text" id="tcNoBulInput" inputmode="numeric" placeholder="T.C. Kimlik No (11 Hane)" maxlength="11">
            <button type="submit" id="noBulBtn" disabled>OKUL NUMARAMI GÖSTER</button>
        </form>

        <div id="noSonuc" class="sonuc-box"></div>

        <button type="button" class="btn-back" onclick="ekranDegistir('anaEkran')">← Ana Sorgulama Ekranına Dön</button>
    </div>
</div>

<script>
    // 1. Ana Sorgulama Sheet CSV Linki
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSkDz2S-vnw6gr6amVAIX7OYj2c8l5WDrDxkWI-8WiKZW1qaaJJJeP0oxcMgYIiozY-ONZV23V0Xw5m/pub?output=csv';
    
    // 2. Okul No Öğrenme Sheet CSV Linki (1. Sütun: T.C. Kimlik No, 2. Sütun: Okul No)
    const ogrNoCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTEqV-TPcJRBojK5961kAGK2S2XUGL4m6aTB9vH7YLCrjgRIk0YV1sv9dwRa0amFV_WSvVpzAndni2j/pub?output=csv';

    let ogrenciListesi = [];
    let okulNoListesi = [];

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function csvToArray(text) {
        let cleanText = text.replace(/\r/g, "");
        let p = '', Array = [[]], Symbol = ',', i = 0, l = 0, q = false;
        for (let character of cleanText) {
            if (character === '"') { q = !q; }
            else if (character === Symbol && !q) { p = ''; Array[i][++l] = p; }
            else if (character === '\n' && !q) { if (Array[i][l] === undefined) { Array[i][l] = p; } p = ''; Array[++i] = [p]; l = 0; }
            else { p += character; Array[i][l] = p; }
        }
        return Array;
    }

    //
