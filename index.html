<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Devamsızlık ve Koordinatör Öğretmen Sorgulama</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #003d80; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; display: none; }
        .success { background-color: #e7f4e4; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        p { margin: 8px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>MESEM Öğrenci Durum Sorgulama</h2>
    <input type="text" id="studentNo" placeholder="Öğrenci Numarasını veya T.C. Giriniz">
    <button onclick="searchStudent()">Sorgula</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    // Google Sheets CSV Yayın Adresiniz
    const SHEET_CSV_URL = 'GOOGLE_SHEETS_CSV_LINKINI_BURAYA_YAZIN';

    async function searchStudent() {
        const query = document.getElementById('studentNo').value.trim();
        const resultDiv = document.getElementById('result');

        if (!query) {
            resultDiv.style.display = 'block';
            resultDiv.className = 'result-box error';
            resultDiv.innerHTML = '<p>Lütfen geçerli bir numara giriniz.</p>';
            return;
        }

        try {
            const response = await fetch(SHEET_CSV_URL);
            const csvText = await response.text();
            
            // Satırları ve virgül/noktalı virgül ayrımlarını yönetme
            const rows = csvText.split('\n').map(row => row.split(','));
            
            let found = false;

            // Sütun Sıralaması Örneği:
            // 0: Okul No / T.C.
            // 1: Adı Soyadı
            // 2: Sınıfı / Alanı
            // 3: İşletme Adı
            // 4: Koordinatör Öğretmen
            // 5: Devamsızlık Gün Sayısı

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (row[0] && row[0].trim() === query) {
                    found = true;
                    resultDiv.style.display = 'block';
                    resultDiv.className = 'result-box success';
                    resultDiv.innerHTML = `
                        <p><strong>Öğrenci No:</strong> ${row[0]}</p>
                        <p><strong>Adı Soyadı:</strong> ${row[1]}</p>
                        <p><strong>Sınıfı / Alanı:</strong> ${row[2]}</p>
                        <p><strong>İşletme Adı:</strong> ${row[3] || 'Belirtilmemiş'}</p>
                        <p><strong>Koordinatör Öğretmen:</strong> ${row[4] || 'Atanmamış'}</p>
                        <p><strong>Devamsızlık Gün Sayısı:</strong> ${row[5] || '0'}</p>
                    `;
                    break;
                }
            }

            if (!found) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result-box error';
                resultDiv.innerHTML = '<p>Aranan numaraya ait kayıt bulunamadı.</p>';
            }

        } catch (err) {
            resultDiv.style.display = 'block';
            resultDiv.className = 'result-box error';
            resultDiv.innerHTML = '<p>Veriler yüklenirken bir hata oluştu. Lütfen tekrar deneyiniz.</p>';
        }
    }
</script>

</body>
</html>
