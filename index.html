<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Sorgulama Paneli</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --success: #ffffff; --danger: #fee2e2; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; border: 1px solid #e2e8f0; }
        h2 { color: var(--primary); margin-bottom: 20px; font-size: 1.5rem; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; font-size: 16px; text-align: center; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: opacity 0.3s; margin-top: 5px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #sonuc { margin-top: 25px; padding: 20px; border-radius: 15px; display: none; border: 1px solid #cbd5e1; text-align: left; background-color: #fff; }
        .name-label { font-size: 1.2rem; font-weight: bold; display: block; margin-bottom: 12px; color: #1e293b; text-transform: uppercase; text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
        
        /* DURUM / İŞLETME UYARI KUTUSU */
        .status-box { 
            margin-top: 15px; 
            padding: 14px; 
            border-radius: 10px; 
            text-align: center; 
            font-weight: 900; 
            font-size: 1.1rem; 
            color: #dc2626; 
            background: #fef2f2; 
            border: 2px solid #fecaca; 
            text-transform: uppercase;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Öğrenci Sorgulama</h2>
    <div id="status" style="font-size:12px; margin-bottom:10px; color:#64748b;">Veriler Hazırlanıyor...</div>
    
    <!-- 2 ADET GİRİŞ ALANI -->
    <input type="text" id="tcSon2Input" placeholder="T.C. Kimlik No (Son 2 Hanesi)" maxlength="2">
    <input type="text" id="ogrNoInput" placeholder="Öğrenci No">
    
    <button id="sorgulaBtn" onclick="sorgula()" disabled>SORGULA</button>
    <div id="sonuc"></div>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSNIYTSZIgdE8jFsC9s3nA29_Q-Dlp5ytoDxzJ7dhw5FuEig0h9wIjEA4m0It_7vCuVPyd7RoVpjoFj/pub?gid=0&single=true&output=csv';
    let ogrenciListesi = [];

    function csvToArray(text) {
        let cleanText = text.replace(/\r/g, "");
        let p = '', Array = [[]], Symbol = ',', i = 0, l = 0, q = false;
        for (let character of cleanText) {
            if (character === '"') { q = !q; }
            else if (character === Symbol && !q) { p = ''; Array[i][++l] = p; }
            else if (character === '\n' && !q) { if (Array[i][l] === undefined) { Array[i][l] = p; } p = ''; Array[++i] = [p]; l = 0; }
            else { p += character; Array[i][l] = p; }
        }
        return Array;
    }

    async function verileriGetir() {
        try {
            const res = await fetch(csvUrl);
            const data = await res.text();
            const satirlar = csvToArray(data);
            
            satirlar.forEach((sutun, index) => {
                if (index === 0) return;
                
                if (sutun && sutun.length >= 2) {
                    const tc = sutun[0]?.trim() || "";
                    const ogrNo = sutun[1]?.trim() || "";
                    const ad = sutun[2]?.trim() || "";
                    const devamsizlik = sutun[4]?.trim() || "BİLGİ YOK"; 
                    
                    // İşletme Sütunu (7. Sütun - İndeks 6)
                    const isletme = (sutun.length > 6 && sutun[6]) ? sutun[6].trim() : ""; 
                    // İşten Ayrılış / İşe Giriş Tarihi Sütunu (8. Sütun - İndeks 7)
                    const tarih = (sutun.length > 7 && sutun[7]) ? sutun[7].trim() : "";
                    
                    // T.C. Kimlik numarasının son 2 hanesini alma
                    const tcSon2 = tc.length >= 2 ? tc.slice(-2) : tc;
                    
                    if(tc) {
                        ogrenciListesi.push({ 
                            tcSon2: tcSon2,
                            ogrNo: ogrNo,
                            ad: ad, 
                            devamsizlik: devamsizlik,
                            isletme: isletme,
                            tarih: tarih
                        });
                    }
                }
            });
            document.getElementById('status').innerHTML = "● Sistem Hazır";
            document.getElementById('sorgulaBtn').disabled = false;
        } catch (e) {
            document.getElementById('status').innerText = "Bağlantı Hatası!";
        }
    }

    function sorgula() {
        const tcSon2Input = document.getElementById('tcSon2Input').value.trim();
        const ogrNoInput = document.getElementById('ogrNoInput').value.trim();
        const sonucDiv = document.getElementById('sonuc');
        
        // Eşleşen öğrenci kontrolü
        const ogrenci = ogrenciListesi.find(o => o.tcSon2 === tcSon2Input && o.ogrNo === ogrNoInput);
        
        if (ogrenci) {
            sonucDiv.style.display = "block";
            sonucDiv.style.backgroundColor = "#fff";
            
            let gosterilecekMetin = "";
            
            // KOŞUL 1: İşletme sütunu doluysa direkt onu göster
            if (ogrenci.isletme && ogrenci.isletme !== "") {
                gosterilecekMetin = ogrenci.isletme;
            } 
            // KOŞUL 2: İşletme sütunu boşsa "KAYITLI İŞLETME YOK" + Tarih göster
            else {
                let tarihBilgisi = ogrenci.tarih ? ` (${ogrenci.tarih})` : "";
                gosterilecekMetin = "KAYITLI İŞLETME YOK" + tarihBilgisi;
            }
            
            sonucDiv.innerHTML = `
                <span class="name-label">${ogrenci.ad}</span>
                <div class="status-box">${gosterilecekMetin}</div>
            `;
        } else {
            sonucDiv.style.display = "block";
            sonucDiv.style.backgroundColor = "var(--danger)";
            sonucDiv.innerHTML = "<div style='text-align:center; color:#991b1b; font-weight:bold;'>❌ T.C. SON 2 HANESİ VEYA ÖĞRENCİ NO HATALI / KAYIT BULUNAMADI</div>";
        }
    }

    document.getElementById('tcSon2Input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sorgula(); });
    document.getElementById('ogrNoInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sorgula(); });
    
    verileriGetir();
</script>

</body>
</html>
