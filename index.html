<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Sorgulama Paneli</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --danger: #fee2e2; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; box-sizing: border-box; }
        .card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 450px; text-align: center; border: 1px solid #e2e8f0; }
        h2 { color: var(--primary); margin-bottom: 20px; font-size: 1.5rem; }
        input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; box-sizing: border-box; font-size: 16px; text-align: center; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: opacity 0.3s; margin-top: 5px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #sonuc { margin-top: 25px; padding: 20px; border-radius: 15px; display: none; border: 1px solid #cbd5e1; text-align: left; background-color: #fff; }
        .name-label { font-size: 1.25rem; font-weight: bold; display: block; margin-bottom: 15px; color: #1e293b; text-transform: uppercase; text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 0.95rem; color: #475569; }
        .info-row:last-child { border-bottom: none; }
        .info-row span { font-weight: 600; color: #64748b; }
        .info-row b { color: #0f172a; text-align: right; max-width: 60%; word-break: break-word; }
        
        .alert-text { color: #dc2626; font-weight: 900; }
    </style>
</head>
<body>

<div class="card">
    <h2>Öğrenci Sorgulama</h2>
    <div id="status" style="font-size:12px; margin-bottom:10px; color:#64748b;">Veriler Yükleniyor...</div>
    
    <input type="text" id="tcInput" placeholder="T.C. Kimlik No" maxlength="11">
    
    <button id="sorgulaBtn" onclick="sorgula()" disabled>SORGULA</button>
    <div id="sonuc"></div>
</div>

<script>
    // 1. SAYFA LINKI (TC -> İsim Listesi)
    const url1 = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9p-ENslt88l69TdrNq2sZO-82paDHESke63diIiRD71mjufNX5m5_m0jyBNl5LyXluRzjYNFH-yHp/pub?output=csv';

    // 2. SAYFA LINKI (Yayınladığınız yeni CSV linki)
    const url2 = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSNIYTSZIgdE8jFsC9s3nA29_Q-Dlp5ytoDxzJ7dhw5FuEig0h9wIjEA4m0It_7vCuVPyd7RoVpjoFj/pub?output=csv';

    let tcListesi = {};       
    let detayListesi = {};   

    function metniTemizle(text) {
        if (!text) return "";
        return text.toString()
            .replace(/^"|"$/g, '')
            .replace(/\s+/g, ' ')
            .trim()
            .toLocaleUpperCase('tr-TR');
    }

    function tcTemizle(text) {
        if (!text) return "";
        return text.toString().replace(/[^0-9]/g, '').trim();
    }

    function csvToArray(text) {
        let cleanText = text.replace(/\r/g, "");
        let p = '', Array = [[]], Symbol = ',', i = 0, l = 0, q = false;
        for (let character of cleanText) {
            if (character === '"') { q = !q; }
            else if (character === Symbol && !q) { p = ''; Array[i][++l] = p; }
            else if (character === '\n' && !q) { if (Array[i][l] === undefined) { Array[i][l] = p; } p = ''; Array[++i] = [p]; l = 0; }
            else { p += character; Array[i][l] = p; }
        }
        return Array;
    }

    async function verileriGetir() {
        const statusDiv = document.getElementById('status');
        try {
            // --- 1. SAYFA VERİLERİNİ ÇEK ---
            const res1 = await fetch(url1);
            if (!res1.ok) throw new Error("1. Sayfa bağlantısı başarısız.");
            const data1 = await res1.text();
            const satirlar1 = csvToArray(data1);

            satirlar1.forEach((sutun, index) => {
                if (index === 0 || !sutun) return;
                // İlk bulduğu geçerli TC ve Ad-Soyad hücrelerini eşleştirir
                let tc = "";
                let ad = "";
                
                sutun.forEach(cell => {
                    let temTc = tcTemizle(cell);
                    if (temTc.length === 11 && !tc) {
                        tc = temTc;
                    } else if (cell && cell.trim().length > 3 && !ad && !tcTemizle(cell)) {
                        ad = metniTemizle(cell);
                    }
                });

                if (tc && ad) {
                    tcListesi[tc] = ad;
                }
            });

            // --- 2. SAYFA VERİLERİNİ ÇEK ---
            const res2 = await fetch(url2);
            if (!res2.ok) throw new Error("2. Sayfa bağlantısı başarısız.");
            const data2 = await res2.text();
            const satirlar2 = csvToArray(data2);

            satirlar2.forEach((sutun, index) => {
                if (index === 0 || !sutun || sutun.length < 2) return;

                // Esnek sütun çekimi
                const ogrNo = sutun[1]?.replace(/^"|"$/g, '').trim() || "-";
                const hamAd = sutun[2]?.replace(/^"|"$/g, '').trim();
                const ad = metniTemizle(hamAd); 
                const sube = sutun[3]?.replace(/^"|"$/g, '').trim() || "-";
                const devamsizlik = sutun[4]?.replace(/^"|"$/g, '').trim() || "-";
                const ogretmen = sutun[5]?.replace(/^"|"$/g, '').trim() || "-";
                const isletme = sutun[6]?.replace(/^"|"$/g, '').trim() || "";
                const iseGiris = sutun[7]?.replace(/^"|"$/g, '').trim() || "-";
                const istenCikis = (sutun.length > 8 && sutun[8]) ? sutun[8].replace(/^"|"$/g, '').trim() : "-";

                if (ad) {
                    detayListesi[ad] = {
                        ogrNo: ogrNo,
                        orijinalAd: hamAd,
                        sube: sube,
                        devamsizlik: devamsizlik,
                        ogretmen: ogretmen,
                        isletme: isletme,
                        iseGiris: iseGiris,
                        istenCikis: istenCikis
                    };
                }
            });

            statusDiv.style.color = "#16a34a";
            statusDiv.innerHTML = "● Sistem Hazır";
            document.getElementById('sorgulaBtn').disabled = false;

        } catch (e) {
            statusDiv.style.color = "#dc2626";
            statusDiv.innerText = "Yükleme Hatası: " + e.message;
        }
    }

    function sorgula() {
        const tcInput = tcTemizle(document.getElementById('tcInput').value);
        const sonucDiv = document.getElementById('sonuc');
        
        if (tcInput.length !== 11) {
            sonucDiv.style.display = "block";
            sonucDiv.style.backgroundColor = "var(--danger)";
            sonucDiv.innerHTML = "<div style='text-align:center; color:#991b1b; font-weight:bold;'>⚠️ Lütfen 11 haneli T.C. giriniz.</div>";
            return;
        }

        const kayitliAd = tcListesi[tcInput];

        if (!kayitliAd) {
            sonucDiv.style.display = "block";
            sonucDiv.style.backgroundColor = "var(--danger)";
            sonucDiv.innerHTML = "<div style='text-align:center; color:#991b1b; font-weight:bold;'>❌ KAYIT BULUNAMADI (T.C. 1. Sayfada yok)</div>";
            return;
        }

        const ogrenciDetay = detayListesi[kayitliAd];

        if (ogrenciDetay) {
            sonucDiv.style.display = "block";
            sonucDiv.style.backgroundColor = "#fff";
            
            let isletmeMetni = ogrenciDetay.isletme;
            if (!isletmeMetni || isletmeMetni === "") {
                let cikisTarihi = ogrenciDetay.istenCikis !== "-" ? ` (${ogrenciDetay.istenCikis})` : "";
                isletmeMetni = `<span class="alert-text">KAYITLI İŞLETME YOK${cikisTarihi}</span>`;
            }

            sonucDiv.innerHTML = `
                <span class="name-label">${ogrenciDetay.orijinalAd}</span>
                <div class="info-row"><span>T.C. No:</span> <b>${tcInput}</b></div>
                <div class="info-row"><span>Öğrenci No:</span> <b>${ogrenciDetay.ogrNo}</b></div>
                <div class="info-row"><span>Şube:</span> <b>${ogrenciDetay.sube}</b></div>
                <div class="info-row"><span>Devamsızlık:</span> <b>${ogrenciDetay.devamsizlik}</b></div>
                <div class="info-row"><span>Öğretmen:</span> <b>${ogrenciDetay.ogretmen}</b></div>
                <div class="info-row"><span>İşletme:</span> <b>${isletmeMetni}</b></div>
                <div class="info-row"><span>İşe Giriş Tarihi:</span> <b>${ogrenciDetay.iseGiris}</b></div>
                <div class="info-row"><span>İşten Çıkış Tarihi:</span> <b>${ogrenciDetay.istenCikis}</b></div>
            `;
        } else {
            sonucDiv.style.display = "block";
            sonucDiv.style.backgroundColor = "var(--danger)";
            sonucDiv.innerHTML = `<div style='text-align:center; color:#991b1b; font-weight:bold;'>❌ İSİM EŞLEŞEMEDİ<br><span style='font-size:12px; font-weight:normal;'>1. Sayfadaki İsim: ${kayitliAd} (2. Sayfada bulunamadı)</span></div>`;
        }
    }

    document.getElementById('tcInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sorgula(); });
    
    verileriGetir();
</script>

</body>
</html>
