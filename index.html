<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.C. Kimlik No ile Bilgi Sorgulama</title>
    <style>
        /* --- GENEL TASARIM VE TEMA --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        /* --- SORGULAMA FORMU --- */
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        .input-group input {
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        /* --- YÜKLENİYOR VE UYARI MESAJLARI --- */
        .loading {
            display: none;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin: 15px 0;
        }

        .alert-error {
            display: none;
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
        }

        /* --- SONUÇ DETAY KARTI --- */
        .result-container {
            display: none;
            margin-top: 25px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 20px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 15px;
            text-align: center;
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
        }

        .data-label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .data-value {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            text-align: right;
        }

        .btn-reset {
            margin-top: 20px;
            width: 100%;
            background-color: #f1f5f9;
            color: #475569;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>Sorgulama Portalı</h2>
            <p>Sisteme kayıtlı bilgilerinizi öğrenmek için T.C. Kimlik numaranızı giriniz.</p>
        </div>

        <!-- T.C. Giriş Formu -->
        <div class="search-box">
            <div class="input-group">
                <label for="tcInput">T.C. KİMLİK NO</label>
                <input type="text" id="tcInput" maxlength="11" placeholder="11 haneli T.C. No giriniz" autocomplete="off">
            </div>
            <button class="btn-submit" id="searchBtn">Sorgula</button>
        </div>

        <!-- Yükleniyor Uyarısı -->
        <div id="loading" class="loading">Veriler sorgulanıyor, lütfen bekleyin...</div>

        <!-- Hata Uyarısı -->
        <div id="errorMessage" class="alert-error"></div>

        <!-- Kişisel Veri Sonuç Paneli -->
        <div id="resultContainer" class="result-container">
            <div class="result-title">Kayıtlı Bilgileriniz</div>
            <div id="dataList" class="data-list">
                <!-- Google Sheets sütun değerleri dinamik olarak buraya gelecek -->
            </div>
            <button class="btn-reset" id="resetBtn">Yeni Sorgulama Yap</button>
        </div>
    </div>

    <script>
        // Google Sheets "Web'de Yayınla" CSV URL'nizi buraya yapıştırın
        const SHEET_URL = 'BURAYA_GOOGLE_SHEETS_CSV_LINKINI_YAPISTIRIN';

        let headers = [];
        let sheetRows = [];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("searchBtn").addEventListener("click", searchTC);
            document.getElementById("resetBtn").addEventListener("click", resetForm);

            // Sadece sayı girilmesine izin ver
            document.getElementById("tcInput").addEventListener("input", (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });

            // Enter tuşuna basınca sorgula
            document.getElementById("tcInput").addEventListener("keypress", (e) => {
                if (e.key === 'Enter') searchTC();
            });
        });

        async function searchTC() {
            const tcValue = document.getElementById("tcInput").value.trim();
            const errorDiv = document.getElementById("errorMessage");
            const loadingDiv = document.getElementById("loading");
            const resultContainer = document.getElementById("resultContainer");

            // Hata ve ekranı sıfırla
            errorDiv.style.display = "none";
            resultContainer.style.display = "none";

            // T.C. Doğrulama (11 Hane kontrolü)
            if (tcValue.length !== 11) {
                showError("Lütfen 11 haneli T.C. Kimlik numaranızı eksiksiz giriniz.");
                return;
            }

            loadingDiv.style.display = "block";

            try {
                // Google Sheets'ten veriyi çek
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("Veri çekilemedi.");
                
                const csvData = await response.text();
                parseAndSearch(csvData, tcValue);

            } catch (error) {
                console.error("Hata:", error);
                showError("Verilere ulaşılamadı. Lütfen internet bağlantınızı veya Sheet bağlantınızı kontrol edin.");
            } finally {
                loadingDiv.style.display = "none";
            }
        }

        function parseAndSearch(csvText, targetTC) {
            // CSV satırlarını böl
            const rows = csvText.split('\n').map(row => row.split(','));
            
            if (rows.length < 2) {
                showError("Tabloda henüz kayıtlı veri bulunmuyor.");
                return;
            }

            // Sütun Başlıkları (1. Satır)
            headers = rows[0].map(h => h.trim().replace(/"/g, ""));

            // T.C. Sütununun kaçıncı indekste olduğunu bul
            // Başlıkta "tc", "t.c.", "tc no", "tc kimlik" yazıyorsa otomatik eşleştirir
            let tcColumnIndex = headers.findIndex(h => {
                const cleanHeader = h.toLowerCase().replace(/[^a-z0-9]/g, '');
                return cleanHeader.includes("tc") || cleanHeader.includes("tckimlik");
            });

            // Eğer başlık bulunamadıysa varsayılan olarak ilk sütun (0) T.C. kabul edilir
            if (tcColumnIndex === -1) {
                tcColumnIndex = 0;
            }

            // T.C. No ile eşleşen satırı ara
            let matchedRow = null;
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (row[tcColumnIndex]) {
                    const cleanCellTC = row[tcColumnIndex].trim().replace(/"/g, "");
                    if (cleanCellTC === targetTC) {
                        matchedRow = row;
                        break;
                    }
                }
            }

            if (matchedRow) {
                displayResult(headers, matchedRow, tcColumnIndex);
            } else {
                showError("Girilen T.C. Kimlik numarasına ait kayıt bulunamadı.");
            }
        }

        function displayResult(headerArray, rowArray, tcIdx) {
            const dataList = document.getElementById("dataList");
            const resultContainer = document.getElementById("resultContainer");
            
            dataList.innerHTML = "";

            // Bulunan satırdaki tüm sütunları şık bir liste halinde bas
            headerArray.forEach((header, index) => {
                const cellValue = rowArray[index] ? rowArray[index].trim().replace(/"/g, "") : "-";

                const itemDiv = document.createElement("div");
                itemDiv.className = "data-item";
                itemDiv.innerHTML = `
                    <span class="data-label">${header}</span>
                    <span class="data-value">${cellValue || '-'}</span>
                `;
                dataList.appendChild(itemDiv);
            });

            resultContainer.style.display = "block";
        }

        function showError(msg) {
            const errorDiv = document.getElementById("errorMessage");
            errorDiv.innerText = msg;
            errorDiv.style.display = "block";
        }

        function resetForm() {
            document.getElementById("tcInput").value = "";
            document.getElementById("resultContainer").style.display = "none";
            document.getElementById("errorMessage").style.display = "none";
            document.getElementById("tcInput").focus();
        }
    </script>
</body>
</html>
