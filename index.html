<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.C. Kimlik No ile Bilgi Sorgulama</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 550px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        .input-group input {
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .loading {
            display: none;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin: 15px 0;
        }

        .alert-error {
            display: none;
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            word-break: break-word;
        }

        .result-container {
            display: none;
            margin-top: 25px;
            border-top: 2px dashed #e2e8f0;
            padding-top: 20px;
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 15px;
            text-align: center;
        }

        .data-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
        }

        .data-label {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .data-value {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            text-align: right;
        }

        .btn-reset {
            margin-top: 20px;
            width: 100%;
            background-color: #f1f5f9;
            color: #475569;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>Sorgulama Portalı</h2>
            <p>Sisteme kayıtlı bilgilerinizi öğrenmek için T.C. Kimlik numaranızı giriniz.</p>
        </div>

        <div class="search-box">
            <div class="input-group">
                <label for="tcInput">T.C. KİMLİK NO</label>
                <input type="text" id="tcInput" maxlength="11" placeholder="11 haneli T.C. No giriniz" autocomplete="off">
            </div>
            <button class="btn-submit" id="searchBtn">Sorgula</button>
        </div>

        <div id="loading" class="loading">Veriler sorgulanıyor, lütfen bekleyin...</div>
        <div id="errorMessage" class="alert-error"></div>

        <div id="resultContainer" class="result-container">
            <div class="result-title">Kayıtlı Bilgileriniz</div>
            <div id="dataList" class="data-list"></div>
            <button class="btn-reset" id="resetBtn">Yeni Sorgulama Yap</button>
        </div>
    </div>

    <script>
        // Google Sheets Canlı CSV Bağlantınız
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSbhS66cyJIkBHPweO8_73pff5HbUQoPhYl4mjY8atTWwKrANg7d0ZVpHzeSHHiOoSAsg_6AZpxQRHQ/pub?output=csv';

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("searchBtn").addEventListener("click", searchTC);
            document.getElementById("resetBtn").addEventListener("click", resetForm);

            document.getElementById("tcInput").addEventListener("input", (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
            });

            document.getElementById("tcInput").addEventListener("keypress", (e) => {
                if (e.key === 'Enter') searchTC();
            });
        });

        // Gelişmiş CSV Ayrıştırıcı (Tırnak içindeki virgülleri bozmaz)
        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            return lines.map(line => {
                const regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*)/g;
                const row = [];
                let matches;
                while ((matches = regex.exec(line)) !== null) {
                    if (matches.index === regex.lastIndex) regex.lastIndex++;
                    let val = matches[1] || '';
                    val = val.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                    row.push(val);
                }
                return row;
            }).filter(row => row.some(cell => cell !== ''));
        }

        async function searchTC() {
            const tcValue = document.getElementById("tcInput").value.trim();
            const errorDiv = document.getElementById("errorMessage");
            const loadingDiv = document.getElementById("loading");
            const resultContainer = document.getElementById("resultContainer");

            errorDiv.style.display = "none";
            resultContainer.style.display = "none";

            if (tcValue.length !== 11) {
                showError("Lütfen 11 haneli T.C. Kimlik numaranızı eksiksiz giriniz.");
                return;
            }

            loadingDiv.style.display = "block";

            try {
                // Ön bellek sorununu önlemek için zaman damgası eklendi
                const cacheBusterUrl = SHEET_URL + '&_t=' + new Date().getTime();
                const response = await fetch(cacheBusterUrl);
                
                if (!response.ok) {
                    throw new Error("Sunucu yanıt vermedi (HTTP " + response.status + ")");
                }
                
                const csvText = await response.text();
                const rows = parseCSV(csvText);

                if (rows.length < 2) {
                    showError("Tabloda veri bulunamadı veya tablo boş.");
                    return;
                }

                const headers = rows[0];

                // TC sütununu bul
                let tcIdx = headers.findIndex(h => {
                    const clean = h.toLowerCase().replace(/[^a-z0-9]/g, '');
                    return clean.includes("tc") || clean.includes("tckimlik");
                });

                if (tcIdx === -1) tcIdx = 0; // Bulamazsa ilk sütunu TC kabul et

                // TC Eşleştirme
                const matchedRow = rows.slice(1).find(row => {
                    if (!row[tcIdx]) return false;
                    const cleanTC = row[tcIdx].replace(/[^0-9]/g, '');
                    return cleanTC === tcValue;
                });

                if (matchedRow) {
                    displayResult(headers, matchedRow);
                } else {
                    showError("Girilen T.C. Kimlik numarasına ait kayıt bulunamadı.");
                }

            } catch (error) {
                console.error("Detaylı Hata:", error);
                showError("Veri çekilemedi. Hata: " + error.message + " (Lütfen Google Sheet yayınlama ayarlarınızı kontrol edin)");
            } finally {
                loadingDiv.style.display = "none";
            }
        }

        function displayResult(headers, row) {
            const dataList = document.getElementById("dataList");
            const resultContainer = document.getElementById("resultContainer");
            
            dataList.innerHTML = "";

            headers.forEach((header, index) => {
                const val = row[index] !== undefined && row[index] !== "" ? row[index] : "-";

                const itemDiv = document.createElement("div");
                itemDiv.className = "data-item";
                itemDiv.innerHTML = `
                    <span class="data-label">${header}</span>
                    <span class="data-value">${val}</span>
                `;
                dataList.appendChild(itemDiv);
            });

            resultContainer.style.display = "block";
        }

        function showError(msg) {
            const errorDiv = document.getElementById("errorMessage");
            errorDiv.innerText = msg;
            errorDiv.style.display = "block";
        }

        function resetForm() {
            document.getElementById("tcInput").value = "";
            document.getElementById("resultContainer").style.display = "none";
            document.getElementById("errorMessage").style.display = "none";
            document.getElementById("tcInput").focus();
        }
    </script>
</body>
</html>
