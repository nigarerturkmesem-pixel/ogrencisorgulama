
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Öğrenci Bilgi Sorgulama</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #1e3a8a;
            font-size: 27px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            text-align: center;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #loading {
            display: none;
            margin-top: 20px;
            color: #2563eb;
        }

        #error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #fee2e2;
            color: #b91c1c;
            font-weight: bold;
        }

        #result {
            display: none;
            margin-top: 25px;
            text-align: left;
        }

        .result-title {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        .info {
            padding: 14px;
            margin-bottom: 10px;
            background: #f1f5f9;
            border-radius: 10px;
        }

        .label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .value {
            font-size: 17px;
            font-weight: bold;
            color: #111827;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Öğrenci Bilgi Sorgulama</h1>

    <div class="subtitle">
        TC Kimlik Numaranızı giriniz
    </div>

    <input
        type="text"
        id="tc"
        maxlength="11"
        inputmode="numeric"
        placeholder="11 haneli TC No"
    >

    <button onclick="sorgula()">
        SORGULA
    </button>

    <div id="loading">
        Bilgiler sorgulanıyor...
    </div>

    <div id="error">
        Kayıt bulunamadı. Lütfen TC numaranızı kontrol ediniz.
    </div>

    <div id="result">

        <h2 class="result-title">Öğrenci Bilgileri</h2>

        <div class="info">
            <div class="label">Öğrenci Ad Soyad</div>
            <div class="value" id="adsoyad"></div>
        </div>

        <div class="info">
            <div class="label">Okul No</div>
            <div class="value" id="okulno"></div>
        </div>

        <div class="info">
            <div class="label">Sınıf</div>
            <div class="value" id="sinif"></div>
        </div>

        <div class="info">
            <div class="label">Okul Günü</div>
            <div class="value" id="okulgunu"></div>
        </div>

    </div>

    <div class="footer">
        Öğrenci Bilgi Sorgulama Sistemi
    </div>

</div>


<script>

    // GOOGLE SHEETS CSV ADRESİ
    const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbhS66cyJIkBHPweO8_73pff5HbUQoPhYl4mjY8atTWwKrANg7d0ZVpHzeSHHiOoSAsg_6AZpxQRHQ/pub?output=csv";


    async function sorgula() {

        const tc = document.getElementById("tc").value.trim();

        const error = document.getElementById("error");
        const result = document.getElementById("result");
        const loading = document.getElementById("loading");

        error.style.display = "none";
        result.style.display = "none";

        // TC kontrolü
        if (!/^\d{11}$/.test(tc)) {

            error.innerText =
                "Lütfen 11 haneli TC Kimlik Numaranızı giriniz.";

            error.style.display = "block";

            return;
        }

        loading.style.display = "block";

        try {

            const response = await fetch(SHEET_URL);

            if (!response.ok) {
                throw new Error("Google Sheets verisi alınamadı.");
            }

            const csv = await response.text();

            const rows = csvToArray(csv);

            if (rows.length < 2) {
                throw new Error("Tabloda veri bulunamadı.");
            }

            /*
                TABLO YAPISI:

                0 = TC NO
                1 = ÖĞRENCİ AD SOYAD
                2 = OKUL NO
                3 = SINIF
                4 = OKUL GÜNÜ
            */

            let bulunan = null;

            for (let i = 1; i < rows.length; i++) {

                const satir = rows[i];

                if (!satir || satir.length < 5) {
                    continue;
                }

                const tcNo = satir[0]
                    .toString()
                    .trim()
                    .replace(/\s/g, "");

                if (tcNo === tc) {

                    bulunan = satir;

                    break;
                }
            }

            loading.style.display = "none";

            if (!bulunan) {

                error.innerText =
                    "Kayıt bulunamadı. Lütfen TC numaranızı kontrol ediniz.";

                error.style.display = "block";

                return;
            }

            // SONUÇLARI GÖSTER

            document.getElementById("adsoyad").innerText =
                bulunan[1] || "-";

            document.getElementById("okulno").innerText =
                bulunan[2] || "-";

            document.getElementById("sinif").innerText =
                bulunan[3] || "-";

            document.getElementById("okulgunu").innerText =
                bulunan[4] || "-";

            result.style.display = "block";

        } catch (e) {

            loading.style.display = "none";

            error.innerText =
                "Verilere ulaşılamadı. Google Sheets bağlantısını kontrol ediniz.";

            error.style.display = "block";

            console.error(e);
        }
    }


    // CSV OKUYUCU
    function csvToArray(text) {

        const rows = [];

        let row = [];
        let cell = "";
        let insideQuotes = false;

        for (let i = 0; i < text.length; i++) {

            const char = text[i];

            if (char === '"') {

                if (
                    insideQuotes &&
                    text[i + 1] === '"'
                ) {
                    cell += '"';
                    i++;
                } else {
                    insideQuotes = !insideQuotes;
                }

            } else if (
                char === "," &&
                !insideQuotes
            ) {

                row.push(cell);
                cell = "";

            } else if (
                (char === "\n" || char === "\r") &&
                !insideQuotes
            ) {

                if (char === "\r" && text[i + 1] === "\n") {
                    i++;
                }

                row.push(cell);

                rows.push(row);

                row = [];
                cell = "";

            } else {

                cell += char;
            }
        }

        if (cell !== "" || row.length > 0) {

            row.push(cell);

            rows.push(row);
        }

        return rows;
    }


    // ENTER TUŞU İLE SORGULAMA
    document.getElementById("tc").addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sorgula();

            }

        }
    );

</script>

</body>
</html>
